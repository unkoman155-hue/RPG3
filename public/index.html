<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>⚔️ 勇者の懸賞金RPG</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <header>
    <h1>⚔️ 勇者の懸賞金RPG</h1>
    <div id="status"></div>
  </header>

  <main>

    <section id="screen" class="panel"></section>

    <section id="log" class="panel log"></section>

  </main>

  <nav id="mainNav" class="nav">

    <button onclick="showHome()">
      🏠 ホーム
    </button>

    <button onclick="showBattle()">
      ⚔️ 戦う
    </button>

    <button onclick="showTown()">
      🏘️ 町
    </button>

    <button onclick="showCity()">
      🏙️ 都市
    </button>

    <button onclick="showGacha()">
      🎰 ガチャ
    </button>

    <button onclick="showBag()">
      🎒 バック
    </button>

    <button onclick="showSettings()">
      ⚙️ 設定
    </button>

  </nav>


  <!-- =========================
       オンライン画面
       最初は表示しない
  ========================== -->

  <div id="onlineOverlay" class="online-overlay hidden">

    <div class="online-box">

      <h2>🌐 オンライン</h2>

      <p id="onlineMessage">
        サーバーに接続しています……
      </p>

      <p id="onlineError"></p>

      <input
        id="onlineName"
        type="text"
        maxlength="20"
        placeholder="プレイヤー名"
        autocomplete="off"
      >

      <button onclick="createOnlineRoom()">
        🆕 ルームを作る
      </button>

      <div class="room-join">

        <input
          id="roomCodeInput"
          type="text"
          maxlength="6"
          placeholder="ルームコード"
          autocomplete="off"
        >

        <button onclick="joinOnlineRoom()">
          🔑 参加
        </button>

      </div>

      <div id="roomInfo" class="room-info hidden">

        <div>
          ルームコード
        </div>

        <strong id="roomCodeDisplay">
          ------
        </strong>

      </div>

      <div
        id="onlinePlayers"
        class="online-players hidden"
      >

        <div class="online-players-title">
          👥 ルーム内プレイヤー
        </div>

        <div id="playerList"></div>

      </div>

      <button
        id="closeOnlineButton"
        class="hidden"
        onclick="closeOnlineOverlay()"
      >
        ▶️ ゲームに戻る
      </button>

      <button onclick="closeOnlineOverlay()">
        ✖ 閉じる
      </button>

    </div>

  </div>


  <!-- オンラインプレイヤー表示 -->

  <div id="remotePlayers"></div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script src="game.js"></script>

</body>
</html>
