<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >

  <title>⚔️ 勇者の懸賞金RPG ONLINE</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- =========================
       ヘッダー
  ========================== -->

  <header>
    <h1>⚔️ 勇者の懸賞金RPG ONLINE</h1>
    <div id="status"></div>
  </header>


  <!-- =========================
       メイン画面
  ========================== -->

  <main>

    <section id="screen" class="panel"></section>

    <section id="log" class="panel log"></section>

  </main>


  <!-- =========================
       メインメニュー
  ========================== -->

  <nav id="mainNav" class="nav">

    <button onclick="showHome()">
      🏠 ホーム
    </button>

    <button onclick="showBattle()">
      ⚔️ 戦う
    </button>

    <button onclick="showTown()">
      🏘️ 町
    </button>

    <button onclick="showCity()">
      🏙️ 都市
    </button>

    <button onclick="showGacha()">
      🎰 ガチャ
    </button>

    <button onclick="showBag()">
      🎒 バック
    </button>

    <button onclick="showSettings()">
      ⚙️ 設定
    </button>

  </nav>


  <!-- =========================
       オンライン画面
  ========================== -->

  <div id="onlineOverlay" class="online-overlay">

    <div class="online-box">

      <h2>🌐 オンライン</h2>

      <p id="onlineMessage">
        サーバーに接続しています……
      </p>

      <p id="onlineError"></p>


      <!-- プレイヤー名 -->

      <input
        id="onlineName"
        type="text"
        maxlength="20"
        placeholder="プレイヤー名"
        autocomplete="off"
      >


      <!-- ルーム作成 -->

      <button onclick="createOnlineRoom()">
        🆕 ルームを作る
      </button>


      <!-- ルーム参加 -->

      <div class="room-join">

        <input
          id="roomCodeInput"
          type="text"
          maxlength="6"
          placeholder="ルームコード"
          autocomplete="off"
        >

        <button
