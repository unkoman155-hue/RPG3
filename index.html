<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>⚔️ 勇者の懸賞金RPG</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <!-- 上部ステータス -->
    <header id="header">

      <h1>⚔️ 勇者の懸賞金RPG</h1>

      <div id="status">
        ゲームを開始してください
      </div>

    </header>


    <!-- メインゲーム画面 -->
    <main>

      <section id="screen" class="panel">

        <!-- game.jsで内容を表示 -->

      </section>


      <!-- メッセージログ -->
      <section id="log" class="panel log">

        <!-- game.jsでメッセージを表示 -->

      </section>

    </main>


    <!-- 下部メニュー -->
    <nav id="mainNav" class="nav">

      <button onclick="showHome()">
        🏠 ホーム
      </button>

      <button onclick="showBattle()">
        ⚔️ 戦う
      </button>

      <button onclick="showBoss()">
        👑 ボス
      </button>

      <button onclick="showTown()">
        🏘️ 町
      </button>

      <button onclick="showCity()">
        🏙️ 都市
      </button>

      <button onclick="showGacha()">
        🎰 ガチャ
      </button>

      <button onclick="showBag()">
        🎒 バッグ
      </button>

      <button onclick="showSettings()">
        ⚙️ 設定
      </button>

    </nav>

  </div>


  <!-- ゲーム本体 -->
  <script src="game.js"></script>

</body>
</html>
